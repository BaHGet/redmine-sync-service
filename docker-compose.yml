services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: redmine-sync-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports_data:/app/exports
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main.js"]

  postgres:
    image: postgres:16-alpine
    container_name: redmine-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncpass}
      POSTGRES_DB: ${POSTGRES_DB:-redmine_sync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncuser} -d ${POSTGRES_DB:-redmine_sync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redmine-sync-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  exports_data:
